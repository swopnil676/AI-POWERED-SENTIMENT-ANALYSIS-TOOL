name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nltk

      - name: Check syntax (compile all files)
        run: python -m py_compile models.py repository.py service.py cli.py main.py

      - name: Download VADER lexicon
        run: python -m nltk.downloader vader_lexicon

      - name: Smoke test (analyze a sentence end to end)
        run: |
          python -c "
          from repository import JSONHistoryRepository
          from service import SentimentService

          repo = JSONHistoryRepository('ci_test_history.json')
          service = SentimentService(repo)
          result = service.analyze('This workflow works great!')
          print(result)
          assert result.sentiment.value == 'Positive'
          "